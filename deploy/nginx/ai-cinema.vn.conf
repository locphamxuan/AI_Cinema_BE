# /etc/nginx/sites-available/ai-cinema.vn  (then: ln -s to sites-enabled, nginx -t, certbot --nginx)
server {
    listen 80;
    server_name ai-cinema.vn www.ai-cinema.vn;
    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Uploads go through the web app's /api rewrite too.
        client_max_body_size 2g;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name api.ai-cinema.vn;
    # Episode uploads and long transcodes.
    client_max_body_size 2g;
    location / {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
