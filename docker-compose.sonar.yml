# Self-hosted SonarQube for an offline analysis, when SonarCloud is not an option.
#   docker compose -f docker-compose.sonar.yml up -d      → http://localhost:9000 (admin / admin)
#   then follow "Analyse locally" in README.md
name: ai-cinema-sonar
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

volumes:
  sonar-data:
  sonar-extensions:
