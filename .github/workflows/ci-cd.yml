# CI/CD of the API.
#   Every push and pull request: lint, typecheck, unit + e2e tests (real Postgres), dependency
#   audit and Docker build.
#   Push to main or a v* tag, all green: the image goes to GHCR, then the optional deploy hook.
# Repository settings it reads (Settings → Secrets and variables → Actions):
#   secrets.DEPLOY_HOOK_URL    optional: called after the image is pushed (Render, Railway, …)
name: CI/CD

on:
  push:
    branches: [main, dev, 'refactor/**', 'feat/**', 'fix/**', 'ci/**', 'chore/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + Prettier, no autofix)
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests with coverage
        run: npm run test:cov
      - name: Build
        run: npm run build
      # The Dockerfile and start:prod run dist/main: a src file importing outside src would move it to dist/src/main.
      - name: Entry point at dist/main.js
        run: test -f dist/main.js

  e2e:
    name: E2E tests (Postgres, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_cinema_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_cinema_e2e"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/ai_cinema_e2e
      E2E_REDIS_URL: redis://localhost:63799
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: E2E tests with coverage (migrates and seeds the database first)
        run: npm run test:e2e:cov
      - name: Prisma schema matches the migrations
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        # The hand-written objects of the migrations (CHECK constraints, triggers, the partial
        # unique index of the support cases) are invisible to `migrate diff`; the HNSW index of
        # the RAG embeddings is not, because the Prisma schema has no syntax for it, so that one
        # line is the only difference the check accepts.
        run: |
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --script > drift.sql
          grep -vE '^\s*(--.*)?$' drift.sql | grep -v 'DROP INDEX "support_knowledge_chunks_embedding_idx";' > drift-unexpected.sql || true
          if [ -s drift-unexpected.sql ]; then echo 'Prisma schema and migrations differ:'; cat drift.sql; exit 1; fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: No high or critical vulnerability in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    needs: [quality, e2e, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-cinema-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      
      - name: Deploy to VPS via SSH
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/ai-cinema && docker compose pull api migrate && docker compose up -d --no-build && docker image prune -f"
            