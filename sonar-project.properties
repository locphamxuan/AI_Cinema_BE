# SonarCloud / SonarQube analysis of the API (run by .github/workflows/ci.yml).
# SonarCloud names an imported GitHub repo <organization>_<repo>; change both if yours differ.
sonar.organization=locphamxuan
sonar.projectKey=locphamxuan_AI_Cinema_BE
sonar.projectName=AI Cinema — Backend

sonar.sources=src,prisma
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts
sonar.exclusions=src/**/*.spec.ts,prisma/migrations/**
sonar.sourceEncoding=UTF-8

# Unit and e2e coverage are merged: most behaviour is exercised end to end against Postgres.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
# Declarations without logic: request DTOs, Nest module wiring, the bootstrap, seed data.
sonar.coverage.exclusions=src/**/dto/**,src/**/*.module.ts,src/main.ts,prisma/**

# Request DTOs repeat the same validation decorators by design.
sonar.cpd.exclusions=src/**/dto/**
